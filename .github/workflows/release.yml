# Builds the IOCCC art titles for the Asciiverse catalog: ascii-fluid and
# ioccc-chaos, each its own catalog title with its own archive per target,
# <id>-<target>.tar.gz, plus one SHA256SUMS file for both, attached to a
# GitHub release (hub/catalog/SCHEMA.md, release.source = "github"). Runs
# on a pushed tag of ours (v<date of the IOCCC source>-av.<n>), or by hand
# for an existing tag.
#
# Linux builds run in Alpine and link ncurses statically, so the binaries
# carry the -musl triple av looks for first and need no libncurses on the
# player's machine. macOS links the system ncurses. No Windows build: the
# launcher runs each entry in a forked child behind pipes and termios.

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base ncurses-dev ncurses-static &&
            LIBS=-lncursesw LDFLAGS="-static -s" asciiverse/build.sh &&
            out/ascii-fluid -l && out/ioccc-chaos -l &&
            asciiverse/package.sh ${{ matrix.target }}'
          file out/ascii-fluid out/ioccc-chaos

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          LIBS=-lncurses CFLAGS="-O2 -arch ${{ matrix.arch }}" LDFLAGS="-arch ${{ matrix.arch }}" asciiverse/build.sh
          strip out/ascii-fluid out/ioccc-chaos
          file out/ascii-fluid out/ioccc-chaos
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "IOCCC art $TAG" \
                 --notes "ascii-fluid (Yusuke Endoh's IOCCC 2012 endoh1) and ioccc-chaos (Alan De Smet's IOCCC 1998 chaos), built for the Asciiverse catalog: one archive per title and target. CC BY-SA 4.0, copyright Landon Curt Noll; attribution in NOTICE, changes in PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
